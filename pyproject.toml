[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["pytest-of-*", ".test-artifacts"]

[tool.ruff.lint]
# 全仓先检查确定性的错误；领域迁移时再逐步扩展风格规则。
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
