repos:
  - repo: local
    hooks:
      - id: backend-lint
        name: Backend lint
        entry: python scripts/check_backend_lint.py
        language: system
        files: ^(backend|scripts)/.*\.py$
        pass_filenames: false
      - id: backend-format
        name: Backend migrated modules format
        entry: python -m ruff format --check
        language: system
        files: ^(backend/data_report_api/(api|shared|jobs)/|scripts/).*\.py$
      - id: architecture
        name: Architecture boundaries
        entry: python scripts/check_architecture.py
        language: system
        pass_filenames: false
      - id: frontend-lint
        name: Frontend lint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|vue|mjs)$
        pass_filenames: false
      - id: frontend-format
        name: Frontend migrated modules format
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/
        pass_filenames: false
