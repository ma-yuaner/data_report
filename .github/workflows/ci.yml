name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python scripts/check_backend_lint.py
      - run: python -m ruff format --check backend/data_report_api/api backend/data_report_api/shared backend/data_report_api/jobs scripts
      - run: python scripts/check_architecture.py --python-only
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run check:architecture
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - run: npm run check:components
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
