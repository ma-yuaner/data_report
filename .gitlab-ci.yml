stages:
  - test
  - build

backend-test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r backend/requirements-dev.txt
    - python scripts/check_backend_lint.py
    - python -m ruff format --check backend/data_report_api/api backend/data_report_api/shared backend/data_report_api/jobs scripts
    - python scripts/check_architecture.py --python-only
    - cd backend
    - python -m pytest -q

frontend-build:
  stage: build
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run format:check
    - npm run check:architecture
    - npm test
    - npm run type-check
    - npm run check:components
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
