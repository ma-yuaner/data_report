stages:
  - test
  - build

backend-test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r backend/requirements-dev.txt
    - cd backend
    - python -m pytest -q

frontend-build:
  stage: build
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run type-check
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
