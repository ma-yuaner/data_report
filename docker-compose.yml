services:
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DATA_MODE: ${DATA_MODE:-mock}
      HIVE_HOST: ${HIVE_HOST:-}
      HIVE_PORT: ${HIVE_PORT:-10000}
      HIVE_DATABASE: ${HIVE_DATABASE:-lywz}
      HIVE_USER: ${HIVE_USER:-}
      HIVE_PASSWORD: ${HIVE_PASSWORD:-}
      HIVE_AUTH: ${HIVE_AUTH:-NONE}
      PROFIT_CACHE_TTL: ${PROFIT_CACHE_TTL:-300}
    ports:
      - "${API_PORT:-5160}:5160"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5160/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-1818}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
