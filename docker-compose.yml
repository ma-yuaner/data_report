services:
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DATA_MODE: ${DATA_MODE:-mysql}
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sibebid}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_CHARSET: ${MYSQL_CHARSET:-utf8mb4}
      MYSQL_CONNECT_TIMEOUT: ${MYSQL_CONNECT_TIMEOUT:-10}
      MYSQL_READ_TIMEOUT: ${MYSQL_READ_TIMEOUT:-60}
      MYSQL_WRITE_TIMEOUT: ${MYSQL_WRITE_TIMEOUT:-60}
      MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-12}
      MYSQL_POOL_MIN_CACHED: ${MYSQL_POOL_MIN_CACHED:-2}
      PERFORMANCE_SLOW_REQUEST_MS: ${PERFORMANCE_SLOW_REQUEST_MS:-500}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_AUTO_CREATE_TABLES: ${AUTH_AUTO_CREATE_TABLES:-true}
      AUTH_IDLE_TIMEOUT_SECONDS: ${AUTH_IDLE_TIMEOUT_SECONDS:-14400}
      AUTH_ABSOLUTE_TIMEOUT_SECONDS: ${AUTH_ABSOLUTE_TIMEOUT_SECONDS:-86400}
      AUTH_SESSION_TOUCH_SECONDS: ${AUTH_SESSION_TOUCH_SECONDS:-60}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCK_SECONDS: ${AUTH_LOCK_SECONDS:-900}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-data_report_session}
      AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-data_report_csrf}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:-}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
      AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME:-系统管理员}
      HIVE_HOST: ${HIVE_HOST:-}
      HIVE_PORT: ${HIVE_PORT:-10000}
      HIVE_DATABASE: ${HIVE_DATABASE:-lywz}
      HIVE_USER: ${HIVE_USER:-}
      HIVE_PASSWORD: ${HIVE_PASSWORD:-}
      HIVE_AUTH: ${HIVE_AUTH:-NONE}
      PROFIT_CACHE_TTL: ${PROFIT_CACHE_TTL:-300}
      RISK_UPLOAD_ENABLED: ${RISK_UPLOAD_ENABLED:-true}
      RISK_UPLOAD_TOKEN: ${RISK_UPLOAD_TOKEN:-}
      RISK_UPLOAD_ROOT: /app/var/risk-uploads
      RISK_UPLOAD_MAX_MB: ${RISK_UPLOAD_MAX_MB:-200}
      RISK_UPLOAD_POLL_SECONDS: ${RISK_UPLOAD_POLL_SECONDS:-2}
    ports:
      - "${API_PORT:-5160}:5160"
    volumes:
      - risk_upload_data:/app/var/risk-uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5160/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "data_report_api.risk_upload_worker"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATA_MODE: ${DATA_MODE:-mysql}
      HIVE_HOST: ${HIVE_HOST:-}
      HIVE_PORT: ${HIVE_PORT:-10000}
      HIVE_DATABASE: ${HIVE_DATABASE:-lywz}
      HIVE_USER: ${HIVE_USER:-}
      HIVE_PASSWORD: ${HIVE_PASSWORD:-}
      HIVE_AUTH: ${HIVE_AUTH:-NONE}
      RISK_UPLOAD_ENABLED: ${RISK_UPLOAD_ENABLED:-true}
      RISK_UPLOAD_ROOT: /app/var/risk-uploads
      RISK_UPLOAD_MAX_MB: ${RISK_UPLOAD_MAX_MB:-200}
      RISK_UPLOAD_WEBHDFS_URL: ${RISK_UPLOAD_WEBHDFS_URL:-}
      RISK_UPLOAD_WEBHDFS_USER: ${RISK_UPLOAD_WEBHDFS_USER:-}
      RISK_UPLOAD_WEBHDFS_HOST_MAP: ${RISK_UPLOAD_WEBHDFS_HOST_MAP:-}
      RISK_UPLOAD_WEBHDFS_CONNECT_TIMEOUT: ${RISK_UPLOAD_WEBHDFS_CONNECT_TIMEOUT:-10}
      RISK_UPLOAD_WEBHDFS_READ_TIMEOUT: ${RISK_UPLOAD_WEBHDFS_READ_TIMEOUT:-300}
      RISK_UPLOAD_HDFS_URI: ${RISK_UPLOAD_HDFS_URI:-hdfs://mycluster}
      RISK_UPLOAD_HDFS_ROOT: ${RISK_UPLOAD_HDFS_ROOT:-/tmp/data-report/risk-uploads}
      RISK_UPLOAD_ORC_TIMEZONE: ${RISK_UPLOAD_ORC_TIMEZONE:-Asia/Shanghai}
      RISK_UPLOAD_POLL_SECONDS: ${RISK_UPLOAD_POLL_SECONDS:-2}
    volumes:
      - risk_upload_data:/app/var/risk-uploads
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-1818}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  risk_upload_data:
