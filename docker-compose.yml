services:
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DATA_MODE: ${DATA_MODE:-mysql}
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sibebid}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_CHARSET: ${MYSQL_CHARSET:-utf8mb4}
      MYSQL_CONNECT_TIMEOUT: ${MYSQL_CONNECT_TIMEOUT:-10}
      MYSQL_READ_TIMEOUT: ${MYSQL_READ_TIMEOUT:-60}
      MYSQL_WRITE_TIMEOUT: ${MYSQL_WRITE_TIMEOUT:-60}
      HIVE_HOST: ${HIVE_HOST:-}
      HIVE_PORT: ${HIVE_PORT:-10000}
      HIVE_DATABASE: ${HIVE_DATABASE:-lywz}
      HIVE_USER: ${HIVE_USER:-}
      HIVE_PASSWORD: ${HIVE_PASSWORD:-}
      HIVE_AUTH: ${HIVE_AUTH:-NONE}
      PROFIT_CACHE_TTL: ${PROFIT_CACHE_TTL:-300}
      RISK_UPLOAD_ENABLED: ${RISK_UPLOAD_ENABLED:-true}
      RISK_UPLOAD_TOKEN: ${RISK_UPLOAD_TOKEN:-}
      RISK_UPLOAD_ROOT: /app/var/risk-uploads
      RISK_UPLOAD_MAX_MB: ${RISK_UPLOAD_MAX_MB:-200}
      RISK_UPLOAD_INSERT_BATCH_SIZE: ${RISK_UPLOAD_INSERT_BATCH_SIZE:-2000}
      RISK_UPLOAD_POLL_SECONDS: ${RISK_UPLOAD_POLL_SECONDS:-2}
    ports:
      - "${API_PORT:-5160}:5160"
    volumes:
      - risk_upload_data:/app/var/risk-uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5160/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "data_report_api.risk_upload_worker"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATA_MODE: ${DATA_MODE:-mysql}
      HIVE_HOST: ${HIVE_HOST:-}
      HIVE_PORT: ${HIVE_PORT:-10000}
      HIVE_DATABASE: ${HIVE_DATABASE:-lywz}
      HIVE_USER: ${HIVE_USER:-}
      HIVE_PASSWORD: ${HIVE_PASSWORD:-}
      HIVE_AUTH: ${HIVE_AUTH:-NONE}
      RISK_UPLOAD_ENABLED: ${RISK_UPLOAD_ENABLED:-true}
      RISK_UPLOAD_ROOT: /app/var/risk-uploads
      RISK_UPLOAD_MAX_MB: ${RISK_UPLOAD_MAX_MB:-200}
      RISK_UPLOAD_INSERT_BATCH_SIZE: ${RISK_UPLOAD_INSERT_BATCH_SIZE:-2000}
      RISK_UPLOAD_POLL_SECONDS: ${RISK_UPLOAD_POLL_SECONDS:-2}
    volumes:
      - risk_upload_data:/app/var/risk-uploads
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-1818}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  risk_upload_data:
